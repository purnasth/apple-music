# Validation only — this workflow never builds and never deploys.
#
# A deploy replaces the whole asset manifest, and the 840 MB of audio is not in
# git, so a CI deploy publishes an empty library over a working one. It has done
# exactly that twice. `npm run build` is therefore absent on purpose: its prebuild
# guard (scripts/check-songs.mjs) would refuse anyway, and correctly so.
#
# Publishing stays manual, from the machine that holds the songs: `npm run deploy`.
# See DEPLOY.md, and keep Cloudflare Builds switched off in the dashboard.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # LayoutProps and friends are generated into .next/types, which tsconfig
      # includes — on a clean clone they do not exist yet and tsc fails with
      # TS2304. `typegen` writes them without running a build, so it does not
      # trip the prebuild song guard the way `next build` would.
      - name: Generate route types
        run: npx next typegen
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
